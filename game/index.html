<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Harbor — Open-World Crime</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<canvas id="gl" aria-label="Ember Harbor: a 3D open-world crime game. Drive, steal cars, fly the helicopter, dodge the police and run fourteen missions across Rust Harbor."></canvas>
<canvas id="hud" aria-hidden="true"></canvas>
<div id="vignette" aria-hidden="true"></div>
<p id="status" role="status" aria-live="polite"></p>
<div id="controls-hint" aria-hidden="true">WASD move · E enter car / board heli · Space climb · X descend · B gun shop · V vigilante · Ctrl sneak · R reload</div>
<div id="fallback" hidden>
  <h1>Ember Harbor</h1>
  <p>This game needs WebGL and JavaScript. Please open it in a desktop browser with WebGL enabled.</p>
</div>
<script src="./vendor/three.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
